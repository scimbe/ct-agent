# Pin the toolchain so CI does not depend on whatever rustc the ubuntu runner image ships.
# Runner image 20261116 brought a newer rustc whose unreachable_code lint fires inside
# libp2p's #[derive(NetworkBehaviour)] (native/src/p2p.rs) and turned `soak` red on main
# while `gate` (older image) stayed green. Bump deliberately, together with any lint fixes.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
