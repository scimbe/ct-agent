name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked || true
          # RUSTSEC-2026-0118 (hickory-proto NSEC3 unbounded-loop advisory) has no fixed
          # upgrade available as of this writing -- ignored explicitly rather than left to
          # silently block every CI run. Revisit (drop the --ignore) once hickory-dns ships
          # a fix.
          #
          # RUSTSEC-2026-0119 (the other hickory-proto advisory, CPU exhaustion) IS fixed
          # for ct-agent's own direct hickory-resolver dependency (bumped to 0.26.1) -- but
          # Cargo.lock still carries a SECOND copy at the vulnerable 0.25.2, pulled in
          # transitively as an optional dependency of libp2p (libp2p-mdns -> hickory-proto
          # 0.25.2, local-network mDNS peer discovery, unrelated to the ACME/DNS-01 path the
          # 0.26.1 bump addresses). `cargo tree -i hickory-proto@0.25.2` shows it as
          # unreachable ("nothing to print") -- it is resolved into Cargo.lock but never
          # actually compiled, since ct-agent doesn't enable libp2p's "mdns" feature.
          # cargo-audit scans Cargo.lock's package list without feature-awareness, so it
          # flags this regardless -- a documented class of cargo-audit false positive.
          # Ignored here for that reason; revisit if libp2p ever makes this reachable.
          #
          # #37: "revisit if libp2p ever makes this reachable" is a request, not a check --
          # nothing would notice. The 0119 ignore rests on ONE mechanical claim, so that
          # claim is now verified on every run instead of trusted: if hickory-proto 0.25.2
          # ever becomes compiled (someone enables libp2p's "mdns" feature, or a new
          # dependency pulls it in), the ignore silently turns a real exposure into
          # silence. `cargo tree -i` prints the dependents when there are any and warns
          # "nothing to print" when there are none, so the absence of that warning IS the
          # signal. Checked BEFORE the audit, so a stale ignore fails loudly rather than
          # being masked by a green audit.
          if ! cargo tree -i hickory-proto@0.25.2 2>&1 | grep -q "nothing to print"; then
            echo "::error::Die Begruendung fuer --ignore RUSTSEC-2026-0119 gilt nicht mehr:" \
                 "hickory-proto 0.25.2 wird jetzt kompiliert. Entweder die Abhaengigkeit" \
                 "aufloesen oder die Ausnahme streichen -- sie deckt ab jetzt eine echte" \
                 "Verwundbarkeit zu (#37)."
            cargo tree -i hickory-proto@0.25.2 2>&1 | head -20
            exit 1
          fi
          echo "0119-Ausnahme weiterhin gedeckt: hickory-proto 0.25.2 ist nicht erreichbar."
          cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

  wasm:
    # ct-agent-wasm IS ct-agent for the browser (workspace restructure, see the
    # root Cargo.toml) -- the `gate` job above builds/tests it NATIVELY (which
    # exercises its pure logic, e.g. the from_hex/holderSign/SignalMessage tests),
    # but never actually cross-compiles it to wasm32, its entire reason to exist.
    # This catches a wasm32-only break (a dependency that silently doesn't support
    # the target, a #[cfg(target_arch = "wasm32")] path with a typo, ...) that the
    # native job structurally cannot see.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build ct-agent-wasm for wasm32
        run: cargo build -p ct-agent-wasm --release --target wasm32-unknown-unknown --locked
