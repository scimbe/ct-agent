name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked || true
          # RUSTSEC-2026-0118 (hickory-proto NSEC3 unbounded-loop) and RUSTSEC-2026-0119
          # (hickory-proto CPU exhaustion) both resolve to the SAME unreachable dependency
          # instance: Cargo.lock carries hickory-proto@0.25.2 only as an optional
          # transitive dependency of libp2p (libp2p-mdns, local-network mDNS peer
          # discovery) -- unrelated to the ACME/DNS-01 path that uses the direct,
          # already-fixed hickory-resolver 0.26.1 dependency. `cargo tree -i
          # hickory-proto@0.25.2` shows it as unreachable ("nothing to print"): resolved
          # into Cargo.lock but never actually compiled, since ct-agent doesn't enable
          # libp2p's "mdns" feature. cargo-audit scans Cargo.lock's package list without
          # feature-awareness, so it flags both regardless -- a documented class of
          # cargo-audit false positive.
          #
          # #37 added the check below for 0119's reachability claim; #39 found it silently
          # already covers 0118's SAME reachability premise too (confirmed 2026-08-18:
          # `cargo audit`'s own report for 0118 names `Version: 0.25.2`, the exact instance
          # this checks), even though the code comment for 0118 up to #39 named a DIFFERENT
          # reason ("no fixed upgrade available") and never mentioned reachability at all.
          if ! cargo tree -i hickory-proto@0.25.2 2>&1 | grep -q "nothing to print"; then
            echo "::error::Die Erreichbarkeits-Begruendung fuer --ignore RUSTSEC-2026-0118" \
                 "UND --ignore RUSTSEC-2026-0119 gilt nicht mehr: hickory-proto 0.25.2 wird" \
                 "jetzt kompiliert. Entweder die Abhaengigkeit aufloesen oder die Ausnahmen" \
                 "streichen -- sie decken ab jetzt eine echte Verwundbarkeit zu (#37, #39)."
            cargo tree -i hickory-proto@0.25.2 2>&1 | head -20
            exit 1
          fi
          echo "0118/0119-Erreichbarkeits-Begruendung weiterhin gedeckt: hickory-proto 0.25.2 ist nicht erreichbar."
          # #39: RUSTSEC-2026-0118's OWN stated justification ("no fixed upgrade available",
          # independent of the reachability check above) had no enforcer at all -- a prose
          # "revisit once hickory-dns ships a fix" comment, exactly the "request, not a
          # check" #37 already called out for 0119. Checked here instead of trusted: run
          # the audit without EITHER ignore, capture its verdict for 0118 specifically, and
          # fail loudly if the "no fixed upgrade" line is gone (a real fix shipped, or the
          # advisory changed shape) instead of the ignore silently continuing to suppress
          # a now-fixable vulnerability forever.
          set +e
          unignored_0118="$(cargo audit --ignore RUSTSEC-2026-0119 2>&1)"
          set -e
          if ! echo "$unignored_0118" | grep -A3 "RUSTSEC-2026-0118" | grep -q "No fixed upgrade is available"; then
            echo "::error::Die Begruendung fuer --ignore RUSTSEC-2026-0118 gilt moeglicherweise" \
                 "nicht mehr: cargo audit nennt keine 'No fixed upgrade is available'-Zeile" \
                 "mehr fuer diese Advisory (neuer Fix, oder die Advisory hat sich veraendert)." \
                 "Pruefen und die Ausnahme ggf. streichen (#39)."
            echo "$unignored_0118" | grep -B2 -A6 "RUSTSEC-2026-0118" || echo "$unignored_0118"
            exit 1
          fi
          echo "0118-Fix-Verfuegbarkeits-Begruendung weiterhin gedeckt: kein Fix verfuegbar."
          cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

  wasm:
    # ct-agent-wasm IS ct-agent for the browser (workspace restructure, see the
    # root Cargo.toml) -- the `gate` job above builds/tests it NATIVELY (which
    # exercises its pure logic, e.g. the from_hex/holderSign/SignalMessage tests),
    # but never actually cross-compiles it to wasm32, its entire reason to exist.
    # This catches a wasm32-only break (a dependency that silently doesn't support
    # the target, a #[cfg(target_arch = "wasm32")] path with a typo, ...) that the
    # native job structurally cannot see.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build ct-agent-wasm for wasm32
        run: cargo build -p ct-agent-wasm --release --target wasm32-unknown-unknown --locked

  setup-scripts:
    # scripts/setup.sh and scripts/setup.ps1 are the actual code the portal's
    # own one-liners (installer.rs's install_one_liner_bootstrap) redirect to --
    # CADS-Tunnel's /install.sh and /install.ps1 are a thin 307 to these files.
    # Neither had ANY test coverage before this job: a real gap found live
    # while writing help.bunsenbrenner.org's sandbox-instructions section
    # (ensure_env()/Import-DotEnv unconditionally demanded a real .env FILE on
    # disk even when the one secret that matters was already in the process
    # environment -- meaning the advertised one-liner could never actually
    # complete non-interactively). ubuntu-latest ships both bash and pwsh, so
    # both real customer-facing scripts get exercised, not just one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh ensure_env() regression test
        run: bash scripts/tests/test-setup-sh-ensure-env.sh
      - name: setup.ps1 Import-DotEnv regression test
        run: pwsh -File scripts/tests/test-setup-ps1-import-dotenv.ps1
