name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked || true
          # RUSTSEC-2026-0118 (hickory-proto NSEC3 unbounded-loop advisory) has no fixed
          # upgrade available as of this writing -- ignored explicitly rather than left to
          # silently block every CI run. Revisit (drop the --ignore) once hickory-dns ships
          # a fix. RUSTSEC-2026-0119 (the other hickory-proto advisory, CPU exhaustion) is
          # NOT ignored -- fixed by the hickory-resolver >=0.26.1 bump in Cargo.toml.
          cargo audit --ignore RUSTSEC-2026-0118
