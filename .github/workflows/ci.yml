name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Lockfile guard -- exactly one ct-common and one ct-control-plane
        # Phase-2 consolidation (CADS-Tunnel/ct-agent, design §4): this crate pins FIVE
        # CADS-Tunnel crates by tag -- ct-common (root workspace dep), ct-control-plane and
        # ct-dns (native/Cargo.toml), and the dev-deps ct-edge and ct-client. They must be
        # bumped TOGETHER: with mixed tags, ct-edge's (and ct-control-plane's) own
        # path-dependency on ct-common resolves to a SECOND ct-common package. The
        # ct_edge-driven tests then stop unifying types (loud), but the production binary
        # can silently carry TWO ct-common copies via ct-control-plane -- two copies of the
        # wire-protocol constants and parsers. Cargo.lock lists every resolved package
        # exactly once per version, so "one `name = ...` line" is the whole check.
        run: |
          for pkg in ct-common ct-control-plane; do
            n="$(grep -c "^name = \"$pkg\"$" Cargo.lock || true)"
            if [ "$n" != "1" ]; then
              echo "::error::Cargo.lock carries $n copies of $pkg (expected exactly 1):" \
                   "mixed CADS-Tunnel tag pins. Bump ct-common, ct-control-plane, ct-dns," \
                   "ct-edge and ct-client to the SAME tag in one commit."
              grep -n -A2 "^name = \"$pkg\"$" Cargo.lock || true
              exit 1
            fi
          done
          echo "lockfile guard: exactly one ct-common and one ct-control-plane resolved."

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked || true
          # Every --ignore below (except the LAST one, see its own comment) pins to the SAME
          # unreachable dependency instance: hickory-proto 0.25.2 / hickory-resolver 0.25.2,
          # resolved into Cargo.lock only as an optional transitive dependency of libp2p-mdns
          # (ct-agent never enables libp2p's "mdns" feature -- local-network peer discovery is
          # not used). The direct, compiled dependency this agent actually uses is
          # hickory-resolver 0.26.x (kept current by plain `cargo update`, currently >=0.26.3),
          # which is unaffected by all of these.
          #
          # The OLD version of this check (#37, #39) additionally asserted that `cargo audit`
          # still printed the literal string "No fixed upgrade is available" for RUSTSEC-2026-
          # 0118 specifically -- a second, independent justification for the same ignore. That
          # assertion broke (2026-11-15) not because the reachability premise changed, but
          # because upstream hickory-dns shipped a fix (hickory-proto >=0.26.0-beta.1) and the
          # advisory text changed shape -- exactly the kind of upstream prose this crate's own
          # code does not control and will keep drifting. Reachability (checked below, every
          # run) is the actual, durable property every one of these ignores rests on; the
          # dated review below is what catches drift in GOOD TIME instead of hard-coding an
          # assertion about upstream wording that was always going to go stale eventually.
          if ! cargo tree -i hickory-proto@0.25.2 --all-features --target all -p ct-agent 2>&1 | grep -q "nothing to print"; then
            echo "::error::Die Erreichbarkeits-Begruendung fuer die hickory-proto@0.25.2-" \
                 "Ausnahmen gilt nicht mehr: hickory-proto 0.25.2 wird jetzt kompiliert." \
                 "Entweder die Abhaengigkeit aufloesen oder die Ausnahmen streichen -- sie" \
                 "decken ab jetzt eine echte Verwundbarkeit zu."
            cargo tree -i hickory-proto@0.25.2 --all-features --target all -p ct-agent 2>&1 | head -20
            exit 1
          fi
          echo "Erreichbarkeits-Begruendung weiterhin gedeckt: hickory-proto 0.25.2 ist nicht erreichbar."
          review_by="2027-02-17"
          if [[ "$(date -u +%F)" > "$review_by" ]]; then
            echo "::error::Die hickory-proto@0.25.2-Ausnahmen unten sind seit $review_by" \
                 "ueberfaellig. cargo audit erneut laufen lassen, Erreichbarkeit neu" \
                 "pruefen, und entweder das Review-Datum erneuern (falls weiterhin" \
                 "unerreichbar und ungefixt) oder die Ausnahmen streichen (falls" \
                 "libp2p-mdns endlich von hickory-proto 0.25.2 weggezogen ist, oder ein" \
                 "echter Fix jetzt angebracht ist)."
            exit 1
          fi
          echo "Review-Datum ($review_by) noch nicht erreicht."
          # RUSTSEC-2026-0459 (libsqlite3-sys 0.28.0, via ct-control-plane's rusqlite 0.31
          # "bundled" feature) is deliberately NOT ignored below: unlike every hickory-proto
          # advisory above, `cargo tree -i libsqlite3-sys@0.28.0 -p ct-agent` is NOT empty --
          # it is a real, compiled, reachable dependency. CADS-Tunnel's own rusqlite pin is
          # itself locked at 0.31 for its own reasons (see crates/control-plane/Cargo.toml's
          # #344 comment there), and no version of libsqlite3-sys satisfying rusqlite 0.31's
          # requirement carries the fix (>=0.39.0 needs rusqlite >=0.32 -- a breaking bump
          # this repo cannot make unilaterally against an externally pinned tag). This is
          # left failing ON PURPOSE: a real, unresolved, reachable vulnerability needs a risk
          # decision by whoever owns that call, not a silent exemption from this script.
          cargo audit \
            --ignore RUSTSEC-2026-0118 `# hickory-proto 0.25.2 -- NSEC3 closest-encloser unbounded loop` \
            --ignore RUSTSEC-2026-0119 `# hickory-proto 0.25.2 -- CPU exhaustion, same root cause family as 0118` \
            --ignore RUSTSEC-2026-0487 `# hickory-proto 0.25.2 -- panic on malformed SVCB/HTTPS alpn value` \
            --ignore RUSTSEC-2026-0489 `# hickory-proto 0.25.2 -- panic on a single-quote SVCB/HTTPS param value` \
            --ignore RUSTSEC-2026-0490 `# hickory-proto 0.25.2 -- zone file lexer panics on a >=4096 char token` \
            --ignore RUSTSEC-2026-0491 `# hickory-proto 0.25.2 -- memory amplification from record counts` \
            --ignore RUSTSEC-2026-0504 `# hickory-proto 0.25.2 -- inverted NSEC3 comparison in DNSSEC validation` \
            --ignore RUSTSEC-2026-0505 `# hickory-proto 0.25.2 -- NSEC3 owner names not checked against the zone` \
            --ignore RUSTSEC-2026-0511 `# hickory-proto 0.25.2 -- NXDOMAIN accepted for a proven empty non-terminal` \
            --ignore RUSTSEC-2026-0512 `# hickory-proto 0.25.2 -- DNSSEC validation accepted an unrelated RRset` \
            --ignore RUSTSEC-2026-0514 `# hickory-resolver 0.25.2 -- lookup returned records failing DNSSEC validation` \
            --ignore RUSTSEC-2026-0530 `# hickory-proto 0.25.2 -- parent-side NSEC at a zone cut proof-of-nonexistence` \
            --ignore RUSTSEC-2026-0531 `# hickory-proto 0.25.2 -- child-side NSEC/NSEC3 "no DS record" acceptance` \
            --ignore RUSTSEC-2026-0532 `# hickory-proto 0.25.2 -- parent-side NSEC3 at a zone cut proof-of-nonexistence` \
            --ignore RUSTSEC-2026-0549 `# hickory-proto 0.25.2 -- NSEC3 NODATA at a zone apex without a matching record` \
            --ignore RUSTSEC-2026-0550 `# hickory-proto 0.25.2 -- unsigned NSEC/NSEC3 used in a nonexistence proof` \
            --ignore RUSTSEC-2026-0551   # hickory-proto 0.25.2 -- DNS class mismatch marked secure without validation

  clippy:
    # ct-agent#176: the panic-free gate. Each crate root (native/src/lib.rs, main.rs and
    # every src/bin/*.rs) carries `#![cfg_attr(not(test), deny(clippy::unwrap_used,
    # clippy::expect_used, clippy::panic, clippy::unreachable, clippy::todo,
    # clippy::unimplemented))]`; this job is what turns that attribute into a merge
    # blocker. `--all-targets` also compiles the test targets, which are built with
    # cfg(test) and therefore WITHOUT the deny -- intended: tests keep their unwraps.
    # `-D warnings` on the clippy invocation promotes every ordinary clippy warning
    # too, so this job is also where any pre-existing style warning surfaces.
    needs: gate
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Add clippy
        run: rustup component add clippy
      - name: Clippy (panic-free gate, -D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

  soak:
    # ct-agent#179: the paused-time soak harness (native/src/soak.rs, a
    # `#[cfg(test)]` module). Each test drives one long-running state machine --
    # the reconnect policy, the TLS-TCP fallback pool, the event ring, /healthz,
    # the stored OIDC credential, the MASQUE pumps, ACME renewal -- through
    # simulated hours to months under tokio's paused clock and asserts bounded
    # resources and no permanent exit. `gate` already runs these tests inside the
    # full suite; this job runs them ALONE and single-threaded, so the sampled
    # invariants (a task gauge, a drop counter) are never skewed by another
    # test's tasks, and so a soak regression is named by its own job. Paused time
    # keeps the whole job well under two minutes of wall clock.
    needs: gate
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Soak (simulated weeks under paused time)
        run: "cargo test --locked -p ct-agent --lib -- soak:: --test-threads=1"

  wasm:
    # ct-agent-wasm IS ct-agent for the browser (workspace restructure, see the
    # root Cargo.toml) -- the `gate` job above builds/tests it NATIVELY (which
    # exercises its pure logic, e.g. the from_hex/holderSign/SignalMessage tests),
    # but never actually cross-compiles it to wasm32, its entire reason to exist.
    # This catches a wasm32-only break (a dependency that silently doesn't support
    # the target, a #[cfg(target_arch = "wasm32")] path with a typo, ...) that the
    # native job structurally cannot see.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build ct-agent-wasm for wasm32
        run: cargo build -p ct-agent-wasm --release --target wasm32-unknown-unknown --locked

  setup-scripts:
    # scripts/setup.sh and scripts/setup.ps1 are the actual code the portal's
    # own one-liners (installer.rs's install_one_liner_bootstrap) redirect to --
    # CADS-Tunnel's /install.sh and /install.ps1 are a thin 307 to these files.
    # Neither had ANY test coverage before this job: a real gap found live
    # while writing help.bunsenbrenner.org's sandbox-instructions section
    # (ensure_env()/Import-DotEnv unconditionally demanded a real .env FILE on
    # disk even when the one secret that matters was already in the process
    # environment -- meaning the advertised one-liner could never actually
    # complete non-interactively). ubuntu-latest ships both bash and pwsh, so
    # both real customer-facing scripts get exercised, not just one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh ensure_env() regression test
        run: bash scripts/tests/test-setup-sh-ensure-env.sh
      - name: setup.sh secret-argv + --docker env passthrough regression test
        run: bash scripts/tests/test-setup-sh-secrets-docker.sh
      - name: setup.sh piped-install (curl | bash) regression test
        run: bash scripts/tests/test-setup-sh-piped.sh
      - name: setup.sh --client-only regression test
        run: bash scripts/tests/test-setup-sh-client-only.sh
      - name: setup.sh + docker/verify-release.sh download verification test
        run: bash scripts/tests/test-setup-sh-verify.sh
      - name: quickstart.sh test (stubbed ct-agent/curl/setup.sh, no network)
        run: bash scripts/tests/test-quickstart-sh.sh
      - name: setup.ps1 Import-DotEnv regression test
        run: pwsh -File scripts/tests/test-setup-ps1-import-dotenv.ps1
      - name: setup.ps1 Install-Docker regression test
        run: pwsh -File scripts/tests/test-setup-ps1-docker.ps1
