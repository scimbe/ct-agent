name: release

# Build the ct-agent binary per OS/arch and publish to a GitHub Release, which is where
# CADS-Tunnel's portal /install.sh and /install.ps1 renderers point (CT_RELEASE_BASE).
# Asset names MUST match those scripts: ct-agent-<os>-<arch>[.exe].
# Triggered by a version tag (e.g. v0.3.0), or dispatched manually with an existing
# tag to (re)build/backfill assets — added when the retired macos-13 runner left
# every release since v0.4.x without its darwin-x86_64 asset (the job queued forever).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true

# On a tag push `inputs.tag` is empty and this falls back to the pushed tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write   # create the release and attach assets

jobs:
  version-matches-tag:
    # The crate version drifted from the release tags for three releases (v0.5.0,
    # v0.5.1, v0.5.2 all shipped binaries whose `--version` said 0.5.0, ct-agent#29):
    # nothing checked it, so nobody noticed until a user tried to VERIFY which build
    # they had. Fail the release instead of publishing another mislabelled binary.
    # ct-agent-wasm is versioned independently and ships no release asset -- not covered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: crate version == tag
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)"
          tag="${RELEASE_TAG#v}"
          echo "crate=$crate tag=$tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::native/Cargo.toml says $crate but the tag is $tag -- bump the crate version before tagging (ct-agent#29)"
            exit 1
          fi

  create-release:
    needs: version-matches-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag || true

  build:
    needs: create-release
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # #160: the three glibc targets are PINNED to ubuntu-22.04 (glibc 2.35). On
          # ubuntu-latest (24.04, glibc 2.39) the shipped binaries silently required
          # GLIBC_2.39 and would not start on Debian 12 (2.36), Ubuntu 22.04 (2.35) or
          # RHEL 9 (2.34) -- found live 2026-09-06 when a bookworm-based container could
          # not exec the v0.7.25 asset. The aarch64 cross-link uses the runner's own
          # gcc-aarch64-linux-gnu sysroot, so it inherits the same floor and moves too.
          # A static musl asset would remove the runner dependency entirely (separate
          # decision, tracked on #160).
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,    asset: ct-agent-linux-x86_64 }
          - { os: ubuntu-22.04,   target: i686-unknown-linux-gnu,      asset: ct-agent-linux-i686 }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu,   asset: ct-agent-linux-aarch64 }
          # macos-13 (the last Intel runner) is retired -- its job queued forever and
          # every v0.4.x release silently shipped without this asset. The ARM runner
          # cross-compiles x86_64-apple-darwin natively (Apple toolchain is dual-arch).
          - { os: macos-14,       target: x86_64-apple-darwin,         asset: ct-agent-darwin-x86_64 }
          - { os: macos-14,       target: aarch64-apple-darwin,        asset: ct-agent-darwin-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      asset: ct-agent-windows-x86_64.exe }
          - { os: windows-latest, target: i686-pc-windows-msvc,        asset: ct-agent-windows-i686.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,     asset: ct-agent-windows-aarch64.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Linux aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Linux i686 cross-linker
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build ct-agent (release)
        # -p ct-agent scopes this to the native/ workspace member only -- since the
        # #6 workspace restructure (ct-agent-wasm moved in as a sibling member), an
        # unscoped `cargo build` would ALSO cross-compile ct-agent-wasm (wasm-bindgen/
        # js-sys/getrandom) for every one of this matrix's native targets, wasted
        # build time at best and a real risk of an unrelated wasm-crate
        # cross-compilation quirk breaking an otherwise-unrelated release build.
        run: cargo build --release --locked --target ${{ matrix.target }} -p ct-agent

      - name: Stage + upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Security-hardening pass, B.1: cloudflared ships signed binaries;
          # this repo shipped neither a signature nor even a checksum, so
          # there was nothing an operator could verify a download against
          # beyond "it's the file GitHub served me". A detached SHA-256
          # checksum is the cheap first step (full Sigstore/cosign or
          # platform Authenticode/notarization signing is a separately
          # tracked, bigger lift). `sha256sum` on Linux/Windows (Git Bash
          # ships it); `shasum -a 256` on macOS, which has no `sha256sum`.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }

          bin="target/${{ matrix.target }}/release/ct-agent"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
          checksum "${{ matrix.asset }}"
          gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber

          # `-p ct-agent` builds BOTH binaries of this package. Until now only the first
          # was uploaded, so `ct-agent-supervisor` (#331) was compiled for all eight
          # targets on every release and then thrown away -- which is why no image could
          # install it and no deployment could use it. It is a drop-in wrapper
          # (`ct-agent-supervisor <subcommand>`, same env), so shipping the binary is what
          # makes "supervise it" an operator decision instead of a rebuild.
          sup="target/${{ matrix.target }}/release/ct-agent-supervisor"
          [ -f "$sup.exe" ] && sup="$sup.exe"
          sup_asset="$(printf '%s' "${{ matrix.asset }}" | sed 's/^ct-agent/ct-agent-supervisor/')"
          cp "$sup" "$sup_asset"
          checksum "$sup_asset"
          gh release upload "$RELEASE_TAG" "$sup_asset" "$sup_asset.sha256" --clobber

  manifest:
    # #184: one signed statement of what this release IS. The per-asset .sha256 files
    # above prove a download arrived intact; they say nothing about who published it,
    # because whoever can write the release can write the checksum next to it. This job
    # collects every published .sha256 into ONE release-manifest.json and -- once the
    # operator has created the signing key -- signs it with an ed25519 key that lives
    # only in the CT_RELEASE_SIGNING_KEY repository secret. ct-agent's self-update pins
    # the matching PUBLIC key (native/src/self_update.rs, RELEASE_SIGNING_PUBKEYS /
    # CT_AGENT_RELEASE_PUBKEY); with a key pinned it refuses any release whose manifest
    # is missing, unsigned, signed by another key, or disagrees with the asset.
    #
    # One-time key setup (scimbe, not yet done as of 2026-09-06):
    #   openssl genpkey -algorithm ed25519 -out ct-release-signing.pem
    #   # public key, 64 hex chars -- paste into RELEASE_SIGNING_PUBKEYS in self_update.rs:
    #   openssl pkey -in ct-release-signing.pem -pubout -outform DER | tail -c 32 | xxd -p -c 64
    #   # then store the PEM (the whole file, including the BEGIN/END lines) as the
    #   # repository secret CT_RELEASE_SIGNING_KEY (Settings -> Secrets -> Actions).
    # Rotation: add the new public key as the second RELEASE_SIGNING_PUBKEYS slot, ship a
    # release signed by the OLD key (so every agent learns the new key), then swap the
    # secret and drop the old slot in the following release.
    #
    # Until the secret exists, the manifest is still built and uploaded UNSIGNED: agents
    # (which pin no key yet) log it as "unverified: no release key pinned" and keep
    # installing on the per-asset .sha256 alone, exactly as before #184. The signing step
    # is gated on the secret being non-empty; a `secrets.*` expression is not allowed in
    # a step-level `if`, so the secret is mapped into the job's env first.
    #
    # Format (schema 1, keys sorted, compact -- the signature is over these EXACT bytes):
    #   {"assets":{"<asset-name>":"<sha256 hex>",...},"created_at":<unix>,"schema":1,"tag":"vX.Y.Z"}
    #   release-manifest.sig = base64 of the raw 64-byte ed25519 signature.
    # Verify by hand:
    #   base64 -d release-manifest.sig > sig.bin
    #   openssl pkeyutl -verify -pubin -inkey ct-release-signing.pub.pem -rawin \
    #     -in release-manifest.json -sigfile sig.bin
    needs: build
    runs-on: ubuntu-latest
    env:
      CT_RELEASE_SIGNING_KEY: ${{ secrets.CT_RELEASE_SIGNING_KEY }}
    steps:
      - name: Download every published checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sums
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p '*.sha256' -D sums
          ls -l sums
          # An empty set means the build matrix uploaded nothing -- refuse to publish a
          # manifest that vouches for no assets.
          [ -n "$(ls -A sums)" ] || { echo "::error::no .sha256 files on release $RELEASE_TAG"; exit 1; }

      - name: Build release-manifest.json
        run: |
          # Deterministic: sorted keys, no whitespace. The asset name is the checksum file
          # name minus its .sha256 suffix; the digest is the first token of its one line
          # (both `sha256sum` and macOS `shasum -a 256` write `<hex>  <name>`).
          python3 - <<'PY'
          import json, os, re, sys, time
          assets = {}
          for fn in sorted(os.listdir("sums")):
              if not fn.endswith(".sha256"):
                  continue
              name = fn[: -len(".sha256")]
              with open(os.path.join("sums", fn), encoding="utf-8") as f:
                  digest = f.read().split()[0].lower()
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  sys.exit(f"{fn}: not a SHA-256 hex digest: {digest!r}")
              assets[name] = digest
          manifest = {
              "schema": 1,
              "tag": os.environ["RELEASE_TAG"],
              "created_at": int(time.time()),
              "assets": assets,
          }
          with open("release-manifest.json", "wb") as f:
              f.write(json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("utf-8"))
          print(open("release-manifest.json").read())
          PY

      - name: Sign release-manifest.json (only when CT_RELEASE_SIGNING_KEY is set)
        if: ${{ env.CT_RELEASE_SIGNING_KEY != '' }}
        run: |
          umask 077
          printf '%s\n' "$CT_RELEASE_SIGNING_KEY" > key.pem
          # Prefer python `cryptography` (preinstalled on the GitHub runner images); fall
          # back to openssl, which produces the identical raw 64-byte signature for ed25519.
          if python3 -c 'import cryptography.hazmat.primitives.serialization' 2>/dev/null; then
            python3 - <<'PY'
          from cryptography.hazmat.primitives import serialization
          with open("key.pem", "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)
          with open("release-manifest.json", "rb") as f:
              sig = key.sign(f.read())
          assert len(sig) == 64
          with open("sig.bin", "wb") as f:
              f.write(sig)
          PY
          else
            openssl pkeyutl -sign -inkey key.pem -rawin -in release-manifest.json -out sig.bin
          fi
          base64 -w0 sig.bin > release-manifest.sig
          echo >> release-manifest.sig
          # Self-check against the public half before publishing anything.
          openssl pkey -in key.pem -pubout -out pub.pem
          openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in release-manifest.json -sigfile sig.bin
          echo "signed with public key $(openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          rm -f key.pem

      - name: Upload the manifest (and its signature, when signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="release-manifest.json"
          if [ -f release-manifest.sig ]; then
            files="$files release-manifest.sig"
          else
            echo "::warning::CT_RELEASE_SIGNING_KEY is not set -- release-manifest.json uploaded UNSIGNED (#184)"
          fi
          # shellcheck disable=SC2086
          # The manifest job has no checkout, so gh must be told the repo explicitly
          # (the download step above already does) -- without -R it fails with
          # "not a git repository" (v0.7.28 release run).
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" $files --clobber
