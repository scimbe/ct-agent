name: release

# Build the ct-agent binary per OS/arch and publish to a GitHub Release, which is where
# CADS-Tunnel's portal /install.sh and /install.ps1 renderers point (CT_RELEASE_BASE).
# Asset names MUST match those scripts: ct-agent-<os>-<arch>[.exe].
# Triggered by a version tag (e.g. v0.3.0), or dispatched manually with an existing
# tag to (re)build/backfill assets — added when the retired macos-13 runner left
# every release since v0.4.x without its darwin-x86_64 asset (the job queued forever).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true

# On a tag push `inputs.tag` is empty and this falls back to the pushed tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Build and publish are separate jobs with separate privileges:
#
#   version-matches-tag  read-only; resolves the tag to ONE commit every leg builds
#   build (matrix)       read-only token, no secrets; hands its binaries to the run as
#                        an artifact and never touches the release
#   sign                 environment `release` (required reviewer, v* tags only); the
#                        only job that can read CT_RELEASE_SIGNING_KEY; no write token
#   publish              the only job with `contents: write`; runs no project code,
#                        checks every byte against the signed manifest, then attaches
#                        everything to a draft release and publishes it in one step
#
# Before this split each build leg held `contents: write` and uploaded straight to the
# release, the manifest job then signed whatever .sha256 files it found THERE, and the
# release was public (empty, then half-filled) while the legs were still running. Now
# code that runs inside `cargo build` (a dependency's build.rs or proc-macro) holds no
# token that can write the release; the signer hashes the artifact bytes itself instead
# of trusting a checksum file; nothing is visible until every leg, the signature and
# the reviewer approval are in; and a failing leg blocks the release instead of
# shipping it without that asset.
#
# Repository settings this workflow relies on (not expressible in this file):
#   * Ruleset "release tags": refs/tags/v* -- restrict creation, update and deletion
#     (bypass: repository admins), so a tag cannot be pushed or moved by anyone else.
#   * Environment `release`: required reviewer(s); deployment tags restricted to v*;
#     holds the secret CT_RELEASE_SIGNING_KEY (delete the repository-level copy).
#     workflow_dispatch backfills must then be started "from" the tag itself.
permissions:
  contents: read

jobs:
  version-matches-tag:
    # The crate version drifted from the release tags for three releases (v0.5.0,
    # v0.5.1, v0.5.2 all shipped binaries whose `--version` said 0.5.0, ct-agent#29):
    # nothing checked it, so nobody noticed until a user tried to VERIFY which build
    # they had. Fail the release instead of publishing another mislabelled binary.
    # ct-agent-wasm is versioned independently and ships no release asset -- not covered.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: tag is a v* tag; pin its commit
        id: tag
        run: |
          # A dispatch input is free text: refuse branch names and anything that is not
          # a version tag, so `ref:` below can only ever resolve to a release tag.
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$RELEASE_TAG' is not a v* release tag"; exit 1 ;;
          esac
          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag $RELEASE_TAG -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: crate version == tag
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)"
          tag="${RELEASE_TAG#v}"
          echo "crate=$crate tag=$tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::native/Cargo.toml says $crate but the tag is $tag -- bump the crate version before tagging (ct-agent#29)"
            exit 1
          fi

  build:
    needs: version-matches-tag
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    # Inherits the read-only default: no job-level write, no GH_TOKEN anywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          # #160: the three glibc targets are PINNED to ubuntu-22.04 (glibc 2.35). On
          # ubuntu-latest (24.04, glibc 2.39) the shipped binaries silently required
          # GLIBC_2.39 and would not start on Debian 12 (2.36), Ubuntu 22.04 (2.35) or
          # RHEL 9 (2.34) -- found live 2026-09-06 when a bookworm-based container could
          # not exec the v0.7.25 asset. The aarch64 cross-link uses the runner's own
          # gcc-aarch64-linux-gnu sysroot, so it inherits the same floor and moves too.
          # A static musl asset would remove the runner dependency entirely (separate
          # decision, tracked on #160).
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,    asset: ct-agent-linux-x86_64 }
          - { os: ubuntu-22.04,   target: i686-unknown-linux-gnu,      asset: ct-agent-linux-i686 }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu,   asset: ct-agent-linux-aarch64 }
          # macos-13 (the last Intel runner) is retired -- its job queued forever and
          # every v0.4.x release silently shipped without this asset. The ARM runner
          # cross-compiles x86_64-apple-darwin natively (Apple toolchain is dual-arch).
          - { os: macos-14,       target: x86_64-apple-darwin,         asset: ct-agent-darwin-x86_64 }
          - { os: macos-14,       target: aarch64-apple-darwin,        asset: ct-agent-darwin-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      asset: ct-agent-windows-x86_64.exe }
          - { os: windows-latest, target: i686-pc-windows-msvc,        asset: ct-agent-windows-i686.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,     asset: ct-agent-windows-aarch64.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tag pointed at when the run started -- not the tag name, so
          # the legs cannot build different trees if the tag moves mid-run.
          ref: ${{ needs.version-matches-tag.outputs.sha }}
          persist-credentials: false

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Linux aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Linux i686 cross-linker
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build ct-agent (release)
        # -p ct-agent scopes this to the native/ workspace member only -- since the
        # #6 workspace restructure (ct-agent-wasm moved in as a sibling member), an
        # unscoped `cargo build` would ALSO cross-compile ct-agent-wasm (wasm-bindgen/
        # js-sys/getrandom) for every one of this matrix's native targets, wasted
        # build time at best and a real risk of an unrelated wasm-crate
        # cross-compilation quirk breaking an otherwise-unrelated release build.
        run: cargo build --release --locked --target ${{ matrix.target }} -p ct-agent


      - name: Stage assets
        shell: bash
        run: |
          # `-p ct-agent` builds BOTH binaries of this package. Until #331 only the first
          # was shipped, so `ct-agent-supervisor` was compiled for all eight targets on
          # every release and then thrown away. It is a drop-in wrapper
          # (`ct-agent-supervisor <subcommand>`, same env), so shipping the binary is what
          # makes "supervise it" an operator decision instead of a rebuild.
          # Checksums are NOT made here: the sign job hashes these exact bytes itself.
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/ct-agent"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.asset }}"
          sup="target/${{ matrix.target }}/release/ct-agent-supervisor"
          [ -f "$sup.exe" ] && sup="$sup.exe"
          cp "$sup" "dist/$(printf '%s' "${{ matrix.asset }}" | sed 's/^ct-agent/ct-agent-supervisor/')"
          ls -l dist

      - name: Hand the binaries to the sign/publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sign:
    # #184: one signed statement of what this release IS. A per-asset .sha256 proves a
    # download arrived intact; it says nothing about who published it, because whoever
    # can write the release can write the checksum next to it. This job hashes every
    # binary the build legs produced into ONE release-manifest.json and -- once the
    # operator has created the signing key -- signs it with an ed25519 key that lives
    # only in the CT_RELEASE_SIGNING_KEY secret of the `release` environment. ct-agent's
    # self-update pins the matching PUBLIC key (native/src/self_update.rs,
    # RELEASE_SIGNING_PUBKEYS / CT_AGENT_RELEASE_PUBKEY); with a key pinned it refuses
    # any release whose manifest is missing, unsigned, signed by another key, or
    # disagrees with the asset.
    #
    # The environment is the gate: its required reviewer approves each release before
    # this job (and so publish) runs, and its tag policy keeps the key out of runs from
    # branches. The job holds no write token at all; publish uploads what it signed.
    #
    # One-time key setup (scimbe, not yet done as of 2026-09-06):
    #   openssl genpkey -algorithm ed25519 -out ct-release-signing.pem
    #   # public key, 64 hex chars -- paste into RELEASE_SIGNING_PUBKEYS in self_update.rs:
    #   openssl pkey -in ct-release-signing.pem -pubout -outform DER | tail -c 32 | xxd -p -c 64
    #   # then store the PEM (the whole file, including the BEGIN/END lines) as the
    #   # secret CT_RELEASE_SIGNING_KEY of the `release` environment
    #   # (Settings -> Environments -> release -> Environment secrets).
    # Rotation: add the new public key as the second RELEASE_SIGNING_PUBKEYS slot, ship a
    # release signed by the OLD key (so every agent learns the new key), then swap the
    # secret and drop the old slot in the following release.
    #
    # Until the secret exists, the manifest is still built and published UNSIGNED: agents
    # (which pin no key yet) log it as "unverified: no release key pinned" and keep
    # installing on the per-asset .sha256 alone, exactly as before #184. The signing step
    # is gated on the secret being non-empty; a `secrets.*` expression is not allowed in
    # a step-level `if`, so the secret is mapped into the job's env first.
    #
    # Format (schema 1, keys sorted, compact -- the signature is over these EXACT bytes):
    #   {"assets":{"<asset-name>":"<sha256 hex>",...},"created_at":<unix>,"schema":1,"tag":"vX.Y.Z"}
    #   release-manifest.sig = base64 of the raw 64-byte ed25519 signature.
    # Verify by hand:
    #   base64 -d release-manifest.sig > sig.bin
    #   openssl pkeyutl -verify -pubin -inkey ct-release-signing.pub.pem -rawin \
    #     -in release-manifest.json -sigfile sig.bin
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    env:
      CT_RELEASE_SIGNING_KEY: ${{ secrets.CT_RELEASE_SIGNING_KEY }}
    steps:
      - name: Collect the build legs' binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ct-agent-*
          path: dist
          merge-multiple: true

      - name: Checksums + release-manifest.json
        run: |
          # Deterministic: sorted keys, no whitespace. Digests are computed HERE from the
          # artifact bytes; the per-asset .sha256 files are written from the same digests
          # in the `<hex>  <name>` format setup.sh / verify-release.sh already parse.
          python3 - <<'PY'
          import hashlib, json, os, sys, time
          names = sorted(os.listdir("dist"))
          if not names:
              sys.exit("no build artifacts -- refusing to sign a manifest that vouches for nothing")
          os.makedirs("meta", exist_ok=True)
          assets = {}
          for name in names:
              if not name.startswith("ct-agent-"):
                  sys.exit(f"unexpected artifact file {name!r}")
              h = hashlib.sha256()
              with open(os.path.join("dist", name), "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              assets[name] = h.hexdigest()
              with open(os.path.join("meta", name + ".sha256"), "w", encoding="utf-8") as f:
                  f.write(f"{assets[name]}  {name}\n")
          manifest = {
              "schema": 1,
              "tag": os.environ["RELEASE_TAG"],
              "created_at": int(time.time()),
              "assets": assets,
          }
          with open("meta/release-manifest.json", "wb") as f:
              f.write(json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("utf-8"))
          print(open("meta/release-manifest.json").read())
          PY

      - name: Sign release-manifest.json (only when CT_RELEASE_SIGNING_KEY is set)
        if: ${{ env.CT_RELEASE_SIGNING_KEY != '' }}
        working-directory: meta
        run: |
          umask 077
          key="$RUNNER_TEMP/key.pem"
          printf '%s\n' "$CT_RELEASE_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          # Prefer python `cryptography` (preinstalled on the GitHub runner images); fall
          # back to openssl, which produces the identical raw 64-byte signature for ed25519.
          if python3 -c 'import cryptography.hazmat.primitives.serialization' 2>/dev/null; then
            KEY="$key" python3 - <<'PY'
          import os
          from cryptography.hazmat.primitives import serialization
          with open(os.environ["KEY"], "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)
          with open("release-manifest.json", "rb") as f:
              sig = key.sign(f.read())
          assert len(sig) == 64
          with open("sig.bin", "wb") as f:
              f.write(sig)
          PY
          else
            openssl pkeyutl -sign -inkey "$key" -rawin -in release-manifest.json -out sig.bin
          fi
          base64 -w0 sig.bin > release-manifest.sig
          echo >> release-manifest.sig
          # Self-check against the public half before anything is handed on.
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in release-manifest.json -sigfile sig.bin
          echo "signed with public key $(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          rm -f sig.bin

      - name: Hand the checksums, manifest and signature to publish
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job that can write the release, and it runs no project code (no checkout,
    # no build): it re-checks that the binaries it is about to upload are byte-for-byte
    # the ones the manifest lists, attaches everything to a DRAFT release, and only then
    # makes it public -- so no installer ever sees a release that is missing assets,
    # checksums or the manifest.
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/fill/publish the release
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ct-agent-*
          path: dist
          merge-multiple: true

      - name: Collect checksums, manifest and signature
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: dist

      - name: Binaries match the (signed) manifest
        working-directory: dist
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          m = json.load(open("release-manifest.json", encoding="utf-8"))
          if m.get("tag") != os.environ["RELEASE_TAG"]:
              sys.exit(f"manifest is for {m.get('tag')!r}, not {os.environ['RELEASE_TAG']!r}")
          meta = {"release-manifest.json", "release-manifest.sig"}
          bins = {n for n in os.listdir(".") if n not in meta and not n.endswith(".sha256")}
          if bins != set(m["assets"]):
              sys.exit(f"binaries {sorted(bins)} != manifest {sorted(m['assets'])}")
          for n in sorted(bins):
              with open(n, "rb") as f:
                  d = hashlib.sha256(f.read()).hexdigest()
              if d != m["assets"][n]:
                  sys.exit(f"{n}: {d} != manifest {m['assets'][n]}")
          print(f"{len(bins)} binaries match the manifest")
          PY
          sha256sum -c ./*.sha256
          [ -f release-manifest.sig ] || echo "::warning::CT_RELEASE_SIGNING_KEY is not set -- release-manifest.json published UNSIGNED (#184)"

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No checkout here, so gh is told the repo explicitly (v0.7.28 release run).
          R=(-R "$GITHUB_REPOSITORY")
          # First run for a tag: a draft. Re-run / workflow_dispatch backfill of an
          # existing release: replace its assets in place (--clobber).
          if ! gh release view "$RELEASE_TAG" "${R[@]}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${R[@]}" --draft --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${R[@]}" ./* --clobber
          # Only a draft is flipped public; an already published (possibly older)
          # release is left as it is, so a backfill never re-marks it "latest".
          if [ "$(gh release view "$RELEASE_TAG" "${R[@]}" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$RELEASE_TAG" "${R[@]}" --draft=false
          fi
