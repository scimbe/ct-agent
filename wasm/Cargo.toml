[package]
name = "ct-agent-wasm"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license-file = "../LICENSE"
description = "ct-common's identity/Noise-handshake/channel-framing core, compiled for wasm32-unknown-unknown and exposed to JavaScript via wasm-bindgen -- the browser side of an Agent-Fabric channel member. This IS ct-agent for the browser: native/ depends on quinn/raw UDP/socket2, none of which exist in a browser, so this is a separate implementation of the same wire protocol against the same ct-common core (see the root Cargo.toml's shared ct-common pin) -- the actual byte transport to the edge is a separate concern (a WebSocket bridge), this crate only ever produces/consumes the same wire bytes native/ does."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ct-common.workspace = true
wasm-bindgen = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# Same version ct-common itself pins -- needed as a direct dependency (not just
# transitive) so this crate can name snow::HandshakeState/TransportState in its
# own NoiseHandshake/NoiseTransport wrapper types below.
snow = "0.9"
# Object/Reflect, to hand decoded signal messages back to JS as a plain object
# (decode_signal_message) rather than a bespoke wasm-bindgen class per variant.
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
